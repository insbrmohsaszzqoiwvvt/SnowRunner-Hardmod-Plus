[paths]
; Папка, в которой установлена игра (та, где лежат папки preload и Sources)
game_dir = D:\Games\SnowRunner

[patches]
; yes - включить, no - выключить. После изменения запустите patch_initial_pak.bat
; Число попыток испытаний: 0 - без ограничения, число - не больше стольких попыток,
; no - как в игре (в Сложном режиме 3)
contest_attempts = 0
; Множитель денежной награды за испытания (золото/серебро/бронза): 1 - как в игре,
; 0.5 - вдвое меньше, 2 - вдвое больше.
contest_reward_factor = 0.5
; Множитель опыта за испытания: 1 - как в игре, 0.5 - вдвое меньше
contest_xp_factor = 0.5
; Продажа прицепов в Сложном режиме (за ту же долю цены, что и грузовики - 50%)
trailer_selling = yes
; Пропуск стартовой заставки (логотипы, предупреждение)
skip_bootup = yes
; Бесплатный ремонт корпуса при въезде в гараж (остальное - за деньги)
garage_body_repair = yes
; Ремонт от любой сервисной машины, аддона или прицепа рядом (как заправка): можно
; чиниться от отцепленного сервисного прицепа или от аддона чужой машины, не
; пересаживаясь и не цепляя прицеп. Источник выбирается стрелками в окне ремонта.
repair_from_nearby = yes
; Перекладка запчастей и колёс между сервисными аддонами и прицепами через окно
; ремонта: сервисные прицепы рядом тоже есть в списке целей; если цели нечего чинить,
; «Ремонт» перекладывает в неё запчасти и колёса из выбранного источника.
repair_parts_transfer = yes
; Зацепите лебёдку за прицеп или машину с упакованным грузом - в меню
; взаимодействия появится «Распаковать груз» для неё
winch_unpack_cargo = yes
