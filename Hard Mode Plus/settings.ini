[paths]
; Папка, в которой установлена игра (та, где лежат папки preload и Sources)
game_dir = D:\Games\SnowRunner

[patches]
; yes - включить, no - выключить. После изменения запустите patch_initial_pak.bat
; Число попыток испытаний: 0 - без ограничения, число - не больше стольких попыток,
; no - как в игре (в Сложном режиме 3)
contest_attempts = 0
; Множитель денежной награды за испытания (золото/серебро/бронза): 1 - как в игре,
; 0.5 - вдвое меньше, 2 - вдвое больше.
contest_reward_factor = 0.5
; Множитель опыта за испытания: 1 - как в игре, 0.5 - вдвое меньше
contest_xp_factor = 0.5
; Продажа прицепов в Сложном режиме (за ту же долю цены, что и грузовики - 50%)
trailer_selling = yes
; Пропуск стартовой заставки (логотипы, предупреждение)
skip_bootup = yes
; Бесплатный ремонт корпуса при въезде в гараж (остальное - за деньги)
garage_body_repair = yes
; Ремонт от любой сервисной машины, аддона или прицепа рядом (как заправка): можно
; чиниться от отцепленного сервисного прицепа или от аддона чужой машины, не
; пересаживаясь и не цепляя прицеп. Источник выбирается стрелками в окне ремонта.
repair_from_nearby = yes
; Перекладка запчастей и колёс между сервисными аддонами и прицепами через окно
; ремонта: каждый сервисный аддон и сервисный прицеп - отдельная цель (как в
; заправке), у неё строки «Все / Пополнить детали / Пополнить колеса»,
; «Ремонт» перекладывает.
repair_parts_transfer = yes
; Замена отдельного колеса: у строки «Колёса» окна ремонта стрелки (мышью или
; стрелками клавиатуры) перебирают «Колёса» -> «Колесо 1» -> «Колесо 2»...
; (слева направо, спереди назад), у колеса видно его состояние, на машине оно
; отмечено маркером. «Ремонт» меняет выбранное колесо на запасное из источника.
repair_single_wheel = yes
; Зацепите лебёдку за прицеп или машину с грузом - «Распаковать груз» и
; «Упаковать груз» в меню взаимодействия будут действовать на её груз
winch_unpack_cargo = yes
; Цена автоматической погрузки на складе (там, где она платная - в Сложном режиме)
; зависит от груза: число - цена за каждый слот, который занимает груз (в игре 150
; за любой груз). 0 - бесплатно, no - как в игре.
cargo_loading_price = 150
; Брёвна считаются не по слотам: цена погрузки умножается на свой множитель для
; коротких, средних (и сожжённых) и длинных брёвен. Можно дробные, например 1.5.
cargo_loading_logs_short = 1
cargo_loading_logs_medium = 2
cargo_loading_logs_long = 3
